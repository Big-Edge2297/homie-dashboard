<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homie Dashboard — Setup</title>
<style>
  :root { --bg:#0d0d10; --card:#17171c; --card2:#1f1f26; --line:rgba(255,255,255,.09); --text:#eee; --muted:rgba(255,255,255,.55); --accent:#d4ae78; --danger:#e5665f; --ok:#6fcf97; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font:15px/1.45 "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; max-width:980px; margin:0 auto; }
  header { padding:18px 20px 10px; }
  header h1 { font-size:20px; font-weight:500; letter-spacing:.04em; }
  header h1 span { color:var(--accent); }
  .steps { display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:4px; }
  .step-chip { flex:none; padding:7px 13px; border-radius:99px; border:1px solid var(--line); background:none; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; letter-spacing:.04em; }
  .step-chip.active { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  .step-chip.done { color:var(--text); }
  .steps { position:relative; }
  .steps.sub { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .step-chip.sub { padding:5px 12px; font-size:11.5px; border-radius:8px; }
  .step-chip.sub.active { background:rgba(212,174,120,.16); color:var(--accent); border-color:var(--accent); }
  main { flex:1; overflow-y:auto; padding:8px 20px 24px; -webkit-overflow-scrolling:touch; }
  footer { display:flex; gap:10px; justify-content:space-between; align-items:center; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg); }
  h2 { font-size:18px; font-weight:500; margin:14px 0 4px; }
  p.lead { color:var(--muted); margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:12px 0; }
  .card h3 { font-size:14px; font-weight:600; margin-bottom:6px; }
  .hint { color:var(--muted); font-size:13px; }
  .warn { color:var(--danger); }
  .ok { color:var(--ok); }
  button.btn { font:inherit; font-size:14px; padding:11px 20px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--text); cursor:pointer; }
  button.btn.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  button.btn.danger { color:var(--danger); }
  button.btn:disabled { opacity:.4; cursor:default; }
  button.link { background:none; border:none; color:var(--accent); font:inherit; font-size:12px; cursor:pointer; padding:2px 6px; }
  input[type=text], input[type=password], input[type=number], select, textarea { font:inherit; font-size:14px; color:var(--text); background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  textarea { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; min-height:340px; }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); flex:none; }
  .search { margin-bottom:10px; }
  .area-head { display:flex; align-items:center; justify-content:space-between; margin:16px 0 6px; padding:0 2px; color:var(--accent); font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); }
  .row .nm { flex:1 1 220px; min-width:0; }
  .row .nm b { font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .nm small { color:var(--muted); font-size:11px; }
  .row .extra { flex:2 1 300px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row .extra input[type=text], .row .extra select { flex:1 1 130px; width:auto; }
  .row .extra label { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .row.missing .nm b { color:var(--danger); }
  .field { margin:12px 0; }
  .field > label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.04em; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }
  details.card summary { cursor:pointer; font-weight:600; font-size:14px; }
  .count { color:var(--muted); font-weight:400; margin-left:6px; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--card2); border:1px solid var(--accent); padding:10px 18px; border-radius:10px; z-index:10; max-width:90%; }
  .danger-zone { border-color:rgba(229,102,95,.55); }
  .danger-zone h3 { color:var(--danger); }
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:var(--card); border:1px solid var(--danger); border-radius:16px; padding:20px; width:100%; max-width:480px; max-height:100%; overflow-y:auto; }
  .modal h3 { color:var(--danger); font-size:17px; margin-bottom:8px; }
  .modal ul { margin:8px 0 12px 20px; color:var(--muted); font-size:13px; }
  .modal .confirm-row { display:flex; gap:10px; align-items:flex-start; margin:12px 0; font-size:13px; }
  .modal .actions { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px; }
  button.btn.danger-solid { background:var(--danger); border-color:var(--danger); color:#fff; font-weight:600; }
  ul.sum { list-style:none; } ul.sum li { padding:7px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
  input[type=color] { width:56px; height:36px; padding:2px; border-radius:8px; background:var(--card2); border:1px solid var(--line); cursor:pointer; }
  .days { display:flex; flex-wrap:wrap; gap:6px; }
  .days label { display:flex; align-items:center; padding:7px 12px; border:1px solid var(--line); border-radius:99px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
  .days label.on { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
  .days input { display:none; }
</style>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="homie-common.js"></script>
<script src="homie-defaults.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
"use strict";
var B = null;
try { B = window.parent && window.parent.homieBridge; } catch (e) {}
var app = document.getElementById("app");
if (!B) {
  app.innerHTML = "<div style='padding:40px;text-align:center'><h2>Open Homie Dashboard from Home Assistant</h2><p class='lead'>This wizard runs inside the Home Assistant sidebar panel.</p></div>";
  return;
}
var C = window.HomieCommon;
var hass = function () { return B.hass(); };

/* ───────────────────────── helpers ───────────────────────── */
function h(tag, props) {
  var el = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") el[k] = v;
    else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v === true ? "" : v);
  });
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return el;
}
function toast(msg) {
  var t = h("div", { class: "toast" }, msg);
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 4500);
}
function areaOf(id) {
  var H = hass(), e = H.entities && H.entities[id], a = e && e.area_id;
  if (!a && e && e.device_id) { var d = H.devices && H.devices[e.device_id]; a = d && d.area_id; }
  return (a && H.areas && H.areas[a]) ? H.areas[a].name : "";
}
function nameOf(id) { var s = hass().states[id]; return (s && s.attributes && s.attributes.friendly_name) || id; }
function entityList(domains) {
  var H = hass();
  return Object.keys(H.states).filter(function (id) {
    if (domains.indexOf(id.split(".")[0]) < 0) return false;
    var r = H.entities && H.entities[id];
    return !(r && (r.hidden || r.entity_category));
  }).map(function (id) { return { id: id, name: nameOf(id), area: areaOf(id) }; })
    .sort(function (a, b) { return (a.area ? 0 : 1) - (b.area ? 0 : 1) || a.area.localeCompare(b.area) || a.name.localeCompare(b.name); });
}
function autoLabel(name, area) {
  if (area && name.toLowerCase().indexOf(area.toLowerCase() + " ") === 0) name = name.slice(area.length + 1);
  return name;
}
var SCENE_STYLES = [
  [/relax|chill|calm|cosy|cozy/i, "relax", "#4a2d7a"], [/romantic|love|date/i, "romantic", "#8b2252"],
  [/movie|cinema|film|tv/i, "movie", "#f0ece4"], [/candle/i, "candle", "#7a4a1e"],
  [/fire/i, "fireplace", "#8b3a10"], [/night|sleep|bed/i, "nightlight", "#6b3800"]
];
function sceneStyle(label) {
  for (var i = 0; i < SCENE_STYLES.length; i++) if (SCENE_STYLES[i][0].test(label)) return { icon: "@icon:scenes." + SCENE_STYLES[i][1], color: SCENE_STYLES[i][2] };
  return { icon: "@icon:scenes.relax", color: "#3a4a6a" };
}

/* ───────────────────────── helpers for the Air quality, Pet, Notifications, Alexa timers and Travel time steps ───────────────────────── */
function omit(o, drop) { var r = {}; Object.keys(o).forEach(function (k) { if (drop.indexOf(k) < 0) r[k] = o[k]; }); return r; }
function pruneEmpty(o) { Object.keys(o).forEach(function (k) { if (o[k] === "" || o[k] === null || o[k] === undefined) delete o[k]; }); return o; }
/* First entity of the given domains whose name or id matches one of the patterns (tried in order). */
function findEntity(domains, pats) {
  var st = hass().states, ids = Object.keys(st).filter(function (id) { return domains.indexOf(id.split(".")[0]) >= 0; });
  for (var p = 0; p < pats.length; p++) for (var i = 0; i < ids.length; i++) {
    var n = ((st[ids[i]].attributes || {}).friendly_name || "") + " " + ids[i];
    if (pats[p].test(n)) return ids[i];
  }
  return "";
}
/* True when the entity has one of the device classes, or its name / id matches the pattern. */
function sensorMatch(id, name, classes, re) {
  var st = hass().states[id], dc = st && st.attributes && st.attributes.device_class;
  return (!!dc && classes.indexOf(dc) >= 0) || re.test(id + " " + name);
}
function timerLabel(id) { var n = nameOf(id); return n.replace(/\s*(next\s+)?timers?\s*$/i, "").trim() || n; }
var DAY_ORDER = [1, 2, 3, 4, 5, 6, 0], DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];   /* 0 = Sunday, as JavaScript's getDay() */
function hourText(n) { return (n < 10 ? "0" : "") + n + ":00"; }

/* Tidies what the three steps edit, so only real choices are saved. Called from collect(). */
function collectExtras() {
  /* Air quality */
  if (C.isPlain(cfg.aqi)) { pruneEmpty(cfg.aqi); if (!Object.keys(cfg.aqi).length) delete cfg.aqi; }
  if (C.isPlain(cfg.indoorAqi)) {
    var ia = cfg.indoorAqi;
    if (Array.isArray(ia.rooms)) {
      ia.rooms.forEach(function (r, i) { pruneEmpty(r); if (!r.label) r.label = "Room " + (i + 1); });
      if (!ia.rooms.length) delete ia.rooms;
    }
    if (!Object.keys(ia).length) delete cfg.indoorAqi;
  }
  /* Pet */
  if (typeof cfg.petName === "string") { cfg.petName = cfg.petName.trim(); if (!cfg.petName) delete cfg.petName; }
  if (C.isPlain(cfg.petStats)) { pruneEmpty(cfg.petStats); if (!Object.keys(cfg.petStats).length) delete cfg.petStats; }
  /* Alerts */
  function listFrom(map, labeller) {
    return Array.from(map.entries()).map(function (e) { return Object.assign({ entity: e[0], label: e[1].label || labeller(e[0]) }, e[1].x || {}); });
  }
  var nl = listFrom(notifMap, nameOf); if (nl.length) cfg.notifications = nl; else delete cfg.notifications;
  var tl = listFrom(timerMap, timerLabel); if (tl.length) cfg.echoTimers = tl; else delete cfg.echoTimers;
  var wl = wazeRows.filter(function (r) { return r && r.entity; }).map(function (r) {
    return Object.assign({}, r, {
      label: r.label || "Travel",
      days: (Array.isArray(r.days) ? r.days : []).slice().sort(),
      timeStart: r.timeStart == null ? 0 : Number(r.timeStart),
      timeEnd: r.timeEnd == null ? 24 : Number(r.timeEnd)
    });
  });
  if (wl.length) cfg.wazeTravelTime = wl; else delete cfg.wazeTravelTime;
}

/* ───────────────────────── state ───────────────────────── */
var cfg = C.clone(B.rawConfig) || {};
var settings = Object.assign({}, B.settings || {});
delete settings.photoFrameInterval;
delete settings.alarmCodeSet; delete settings.alarmCodeUsable;
/* The saved alarm code is never sent to the browser. Typing here replaces it; leaving it blank keeps it. */
var alarmInput = "", alarmClear = false;
var KINDS = [
  { id: "lights",    label: "Lights",    domains: ["light"],                   mode: "rooms",  chip: { showCount: true } },
  { id: "scenes",    label: "Scenes",    domains: ["scene"],                   mode: "scenes", chip: { noRoomGrouping: true, isSceneChip: true } },
  { id: "aircon",    label: "Air Con",   domains: ["climate"],                 mode: "flat",   chip: { showCount: true } },
  { id: "purifiers", label: "Purifiers", domains: ["fan"],                     mode: "flat",   chip: { showCount: true } },
  { id: "blinds",    label: "Blinds",    domains: ["cover"],                   mode: "flat",   chip: { showCount: true, noRoomGrouping: true }, curtain: true },
  { id: "switches",  label: "Switches",  domains: ["switch", "input_boolean", "automation"], mode: "flat",   chip: { showCount: true } },
  { id: "bath",      label: "Bath",      domains: ["switch", "input_boolean"], mode: "rooms",   chip: { showCount: true } },
  { id: "plants",    label: "Plants",    domains: ["switch", "input_boolean"], mode: "flat",   chip: { showCount: true } }   /* irrigation toggles; the dashboard finds this group by its "Plants" label */
];
var kindById = function (id) { return KINDS.filter(function (k) { return k.id === id; })[0]; };
var ALARM_PRESETS = [
  { icon: "windows", label: "Windows", ok: "Closed", bad: "Open",     noun: "window" },
  { icon: "doors",   label: "Doors",   ok: "Closed", bad: "Open",     noun: "door" },
  { icon: "motion",  label: "Motion",  ok: "Clear",  bad: "Detected", count: false, warn: false },
  { icon: "garage",  label: "Garage",  ok: "Closed", bad: "Open",     noun: "garage door" }
];
var model, camMap, musicMap, calMap, alarmRows, soilMap, bathSections, notifMap, timerMap, wazeRows;

function parseChip(k, chip) {
  var map = new Map();
  var ok = true;
  function rest(o, drop) { var r = {}; Object.keys(o).forEach(function (x) { if (drop.indexOf(x) < 0) r[x] = o[x]; }); return r; }
  if (k.mode === "rooms" && k.id === "bath" && Array.isArray(chip.subEntities) && !chip.subGroups) {
    chip.subEntities.forEach(function (e) {
      if (e.expandable) ok = false;
      map.set(e.entity, { label: e.label, room: "", x: rest(e, ["label", "entity"]) }); });
  } else if (k.mode === "rooms") {
    if (chip.subEntities || !Array.isArray(chip.subGroups)) return null;
    chip.subGroups.forEach(function (g) { (g.subEntities || []).forEach(function (e) {
      if (e.expandable) ok = false;
      map.set(e.entity, { label: e.label, room: g.label, x: rest(e, ["label", "entity"]) }); }); });
  } else if (k.mode === "scenes") {
    if (!Array.isArray(chip.subGroups)) return null;
    chip.subGroups.forEach(function (g) { (g.scenes || []).forEach(function (s) {
      map.set(s.entity, { label: s.label, room: g.label, color: s.color, icon: s.icon, x: rest(s, ["label", "entity", "color", "icon"]) }); }); });
  } else {
    if (chip.subGroups || !Array.isArray(chip.subEntities)) return null;
    chip.subEntities.forEach(function (e) {
      if (e.expandable) ok = false;
      map.set(e.entity, { label: e.label, x: rest(e, ["label", "entity"]) }); });
  }
  return ok ? { map: map, meta: rest(chip, ["subGroups", "subEntities"]) } : null;
}
function parseControls(controls) {
  var m = { order: [], maps: {}, meta: {} };
  KINDS.forEach(function (k) { m.maps[k.id] = new Map(); });
  (controls || []).forEach(function (chip) {
    var id = chip._homie || (KINDS.filter(function (k) { return k.label.toLowerCase() === String(chip.label || "").toLowerCase(); })[0] || {}).id;
    var k = id && kindById(id), parsed = k && !m.maps[k.id].size && parseChip(k, chip);
    if (parsed) { m.maps[k.id] = parsed.map; m.meta[k.id] = parsed.meta; m.order.push({ kind: k.id }); }
    else m.order.push({ custom: chip });
  });
  return m;
}
/* A v4 config keeps the siren and garage buttons in "security" and the siren status in "alarmUi". The Alarm step now holds both,
   so they are moved there once. The dashboard treats the moved settings exactly like the old ones. */
var legacyMigrated = false;
function migrateLegacySecurity() {
  var sec = Array.isArray(cfg.security) ? cfg.security : [];
  if (sec.length) {
    var blocked = false;
    [["siren", "siren.turn_on", "siren.turn_off", "onEntity", "offEntity"], ["garage", "cover.garage_door_open", "cover.garage_door_close", "openEntity", "closeEntity"]].forEach(function (p) {
      var a = sec.filter(function (e) { return e && e.entity === p[1]; })[0], b = sec.filter(function (e) { return e && e.entity === p[2]; })[0];
      if (!a && !b) return;
      var sc = cfg.securityControls = C.isPlain(cfg.securityControls) ? cfg.securityControls : {};
      var o = sc[p[0]] = C.isPlain(sc[p[0]]) ? sc[p[0]] : {};
      if (o.entity) { blocked = true; return; }          // a single entity is set as well, so moving would change what the buttons do: leave the v4 list alone
      if (a) o[p[3]] = a.entity;
      if (b) o[p[4]] = b.entity;
      legacyMigrated = true;
    });
    if (!blocked) delete cfg.security;                    // the dashboard never used any other entry of that list
  }
  var au = cfg.alarmUi;
  if (C.isPlain(au)) {
    if (au.sirenEntity) {
      var sc2 = cfg.securityControls = C.isPlain(cfg.securityControls) ? cfg.securityControls : {};
      sc2.siren = C.isPlain(sc2.siren) ? sc2.siren : {};
      if (!sc2.siren.stateEntity) sc2.siren.stateEntity = au.sirenEntity;
      legacyMigrated = true;
    }
    delete au.sirenEntity;
    if (!Object.keys(au).length) delete cfg.alarmUi;
  }
}
function initModels() {
  migrateLegacySecurity();
  model = parseControls(cfg.controls);
  camMap = new Map((cfg.cameras || []).map(function (c) { return [c.entity, { label: c.label, motion: c.motionEntity || "" }]; }));
  musicMap = new Map((cfg.musicPlayers || []).map(function (p) { return [p.entity, { label: p.label }]; }));
  var labels = (cfg.calendarDashboard && cfg.calendarDashboard.labels) || {};
  calMap = new Map((cfg.calendarEntities || []).map(function (e) { return [e, { label: labels[e] || autoLabel(nameOf(e), "") }]; }));
  notifMap = new Map((cfg.notifications || []).filter(function (n) { return n && n.entity; }).map(function (n) { return [n.entity, { label: n.label || "", x: omit(n, ["entity", "label"]) }]; }));
  timerMap = new Map((cfg.echoTimers || []).filter(function (n) { return n && n.entity; }).map(function (n) { return [n.entity, { label: n.label || "", x: omit(n, ["entity", "label"]) }]; }));
  var wz = cfg.wazeTravelTime;   /* older configs hold a single object instead of a list */
  wazeRows = (Array.isArray(wz) ? wz : (C.isPlain(wz) ? [wz] : [])).filter(C.isPlain).map(C.clone);
  bathSections = [];
  model.maps.bath.forEach(function (en) { if (en.room && bathSections.indexOf(en.room) < 0) bathSections.push(en.room); });
  soilMap = new Map(((cfg.garden && cfg.garden.soilMoisture) || []).filter(function (p) { return p && p.entity; }).map(function (p) {
    var x = {}; Object.keys(p).forEach(function (k) { if (k !== "entity" && k !== "label") x[k] = p[k]; });
    return [p.entity, { label: p.label || "", x: x }];
  }));
  alarmRows = { custom: [] };
  (cfg.alarmGroups || []).forEach(function (g) {
    var p = ALARM_PRESETS.filter(function (x) { return x.icon === g.icon; })[0];
    if (p && !alarmRows[p.icon]) alarmRows[p.icon] = { entity: g.entity || "", label: g.label || p.label, base: g };
    else alarmRows.custom.push(g);            // any other group from an imported config is kept as it is
  });
}
function buildAlarmGroups() {
  var out = [];
  ALARM_PRESETS.forEach(function (p) {
    var r = alarmRows[p.icon]; if (!r || !r.entity) return;
    out.push(Object.assign({}, p, r.base || {}, { label: r.label || p.label, entity: r.entity }));
  });
  return out.concat(alarmRows.custom);
}
function buildControls() {
  var out = [];
  var order = model.order.slice();
  KINDS.forEach(function (k) { if (!order.some(function (o) { return o.kind === k.id; })) order.push({ kind: k.id }); });
  order.forEach(function (o) {
    if (o.custom) { out.push(o.custom); return; }
    var k = kindById(o.kind), map = model.maps[k.id];
    /* The Plants button must exist whenever plant sensors are chosen, even with no irrigation switches */
    if (!map.size && !(k.id === "plants" && soilMap && soilMap.size)) return;
    var chip = Object.assign({ label: k.label }, k.chip, model.meta[k.id] || {}, { _homie: k.id });
    var entries = Array.from(map.entries());
    var flatBath = k.id === "bath" && entries.every(function (en) { return !en[1].room; });
    if (k.mode === "flat" || flatBath) {
      chip.subEntities = entries.map(function (en) { return Object.assign({ label: en[1].label || nameOf(en[0]), entity: en[0] }, en[1].x || {}); });

    m.appendChild(h("p", { class: "hint" }, "You can reopen this wizard any time from Settings → About → Open setup in the dashboard."));
    if (!B.isAdmin) m.appendChild(h("p", { class: "warn" }, "Saving needs an administrator account."));
  } }
];

/* ───────────────────────── shell ───────────────────────── */
/* The pages above are grouped into six sections. A section with several pages shows them as a second row of
   sub-tabs, sorted A to Z by label. Back and Next walk through every page in this order. */
var NAV_LABELS = { floors: "Floor Sensors", homestats: "Home Stats", travel: "Travel Time", air: "Air Quality", calendars: "Calendar" };
var SECTIONS = [
  { title: "Welcome", ids: ["welcome"] },
  { title: "General", ids: ["greeting", "floors", "homestats", "notifications", "travel", "timers"] },
  { title: "Pills", ids: ["lights", "scenes", "climate", "blinds", "bath", "plants", "switches"] },
  { title: "Dashboards", ids: ["cameras", "car", "weather", "alarm", "music", "calendars", "air", "pet", "solar", "presence", "myday"] },
  { title: "Advanced", ids: ["advanced"] },
  { title: "Review & Save", ids: ["review"] }
];
function navLabel(st) { return NAV_LABELS[st.id] || st.title; }
var order = [], secOf = [], secFirst = [];
(function () {
  var byId = {}, placed = {};
  steps.forEach(function (st) { byId[st.id] = st; });
  SECTIONS.forEach(function (sec) { sec.ids.forEach(function (id) { placed[id] = true; }); });
  steps.forEach(function (st) { if (!placed[st.id]) SECTIONS[1].ids.push(st.id); });   /* a page without a section is never lost */
  SECTIONS.forEach(function (sec, si) {
    sec.steps = sec.ids.map(function (id) { return byId[id]; }).filter(Boolean);
    sec.steps.sort(function (x, y) { return navLabel(x).localeCompare(navLabel(y), undefined, { sensitivity: "base" }); });
    secFirst[si] = order.length;
    sec.steps.forEach(function (st) { order.push(st); secOf.push(si); });
  });
})();
var cur = 0, lastIn = {};
var elHeader, elMain, elFooter;
function go(i) { cur = Math.max(0, Math.min(order.length - 1, i)); lastIn[secOf[cur]] = cur; render(); }
function goSection(si) { go(lastIn[si] != null ? lastIn[si] : secFirst[si]); }
function render() {
  app.innerHTML = "";
  var si = secOf[cur], sec = SECTIONS[si];
  elHeader = h("header", {}, h("h1", {}, "HOMIE ", h("span", {}, "SETUP")));
  var chips = h("div", { class: "steps" });
  SECTIONS.forEach(function (x, i) {
    chips.appendChild(h("button", { class: "step-chip" + (i === si ? " active" : i < si ? " done" : ""), onclick: function () { goSection(i); } }, (i + 1) + ". " + x.title));
  });
  elHeader.appendChild(chips);
  var sub = null;
  if (sec.steps.length > 1) {
    sub = h("div", { class: "steps sub" });
    sec.steps.forEach(function (st) {
      var idx = order.indexOf(st);
      sub.appendChild(h("button", { class: "step-chip sub" + (idx === cur ? " active" : idx < cur ? " done" : ""), onclick: function () { go(idx); } }, navLabel(st)));
    });
    elHeader.appendChild(sub);
  }
  elMain = h("main", {});
  order[cur].render(elMain);
  var last = cur === order.length - 1;
  var save = h("button", { class: "btn primary", disabled: !B.isAdmin, onclick: function () {
    collect(); save.disabled = true; save.textContent = "Saving…";
    B.saveConfig({ config: cfg, settings: settings, alarmCode: alarmClear ? "" : (alarmInput ? alarmInput : undefined) }).then(function () { return B.openDashboard(); })
      .catch(function (e) { save.disabled = false; save.textContent = "Save & open dashboard"; toast("Could not save: " + (e && e.message ? e.message : JSON.stringify(e))); });
  } }, "Save & open dashboard");
  elFooter = h("footer", {},
    h("div", { style: "display:flex;gap:10px" },
      h("button", { class: "btn", disabled: cur === 0, onclick: function () { go(cur - 1); } }, "Back"),
      B.configured ? h("button", { class: "btn", onclick: function () { B.openDashboard(); } }, "Exit without saving") : null),
    last ? save : h("button", { class: "btn primary", onclick: function () { go(cur + 1); } }, "Next"));
  app.appendChild(elHeader); app.appendChild(elMain); app.appendChild(elFooter);
  [chips, sub].forEach(function (row) {   /* keep the active tab in view on narrow screens */
    var a = row && row.querySelector(".active");
    if (a) row.scrollLeft = a.offsetLeft - (row.clientWidth - a.offsetWidth) / 2;
  });
}

initModels();
render();
})();
</script>
